site_name: Data Engineering Interview Guide
site_description: Practical data engineering interview questions with PySpark, SQL, cloud, lakehouse, and data modeling examples.
site_url: ""
repo_url: https://github.com/sai-guntupalli/data-engineering-interview-questions
repo_name: sai-guntupalli/data-engineering-interview-questions
edit_uri: ""
docs_dir: .docs_src
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  logo: img/icon/dwha.ico
  favicon: img/icon/dwha.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

extra_css:
  - assets/stylesheets/extra.css
