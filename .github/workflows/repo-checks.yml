# Pull requests: fast checks (lint, unit tests, notebook audit, practice answers, site build) in one job, and only
# the notebooks and challenge fixtures the pull request touches, split across parallel shards.
# Pushes to master (and manual runs) execute every notebook, in four shards.
# `make validate` still runs everything locally, in one process.

name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Lint, tests, audit and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Notebook audit
        run: make check

      # Python practice answers run in plain kernels (no Spark), in well under a minute.
      - name: Practice answers
        run: make verify-practice

      - name: Site build
        run: make build

  plan:
    name: Plan notebook runs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff against the base branch needs history

      - id: plan
        name: Choose notebooks and fixtures
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/ci_plan.py --base "$BASE" --shards 4 --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_plan.py --all --shards 4 --github-output "$GITHUB_OUTPUT"
          fi

  notebooks:
    name: Notebooks ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # PySpark notebooks need a JVM; PySpark 4.0 supports Java 17 and 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Delta Lake jars resolved by Ivy: cached so runs do not depend on Maven Central being reachable.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-

      - name: Install notebook packages
        run: uv sync --extra notebooks

      # Resolve Delta before parallel notebook kernels share the Ivy cache.
      - name: Prepare Spark dependencies
        run: |
          for attempt in 1 2 3; do
            if uv run --extra notebooks python - <<'PYCODE'
          from delta import configure_spark_with_delta_pip
          from pyspark.sql import SparkSession

          spark = configure_spark_with_delta_pip(
              SparkSession.builder.master("local[1]").appName("ci-delta-dependencies")
          ).getOrCreate()
          spark.stop()
          PYCODE
            then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          exit 1

      - name: Execute notebooks (estimate ${{ matrix.estimate_seconds }}s of work)
        if: matrix.notebooks != ''
        run: uv run --extra notebooks python scripts/run_notebooks.py --jobs 4 ${{ matrix.notebooks }}

      - name: Verify challenge answers
        if: matrix.fixtures != ''
        run: uv run --extra notebooks python scripts/verify_challenge_answers.py ${{ matrix.fixtures }}

  # One stable status to look at (and to require in branch rules): green only when every job above passed or was
  # rightly skipped.
  validate:
    name: validate
    if: always()
    needs: [quick, plan, notebooks]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "quick=${{ needs.quick.result }} plan=${{ needs.plan.result }} notebooks=${{ needs.notebooks.result }}"
          test "${{ needs.quick.result }}" = "success"
          test "${{ needs.plan.result }}" = "success"
          case "${{ needs.notebooks.result }}" in success|skipped) ;; *) exit 1 ;; esac
