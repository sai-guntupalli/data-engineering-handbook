# Runs `make validate`, the same target you run locally: lint, unit tests, the
# notebook audit, execution of every notebook (as Colab's "Run all" would), and
# the site build.

name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # PySpark notebooks need a JVM; PySpark 4.0 supports Java 17 and 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: make install

      - name: Validate
        run: make validate
