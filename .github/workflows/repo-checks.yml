# Runs `make validate`, the same target you run locally: lint, unit tests, the
# notebook audit, execution of every notebook (as Colab's "Run all" would), and
# the site build.

name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # PySpark notebooks need a JVM; PySpark 4.0 supports Java 17 and 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: make install

      # Resolve Delta before parallel notebook kernels share the Ivy cache.
      - name: Prepare Spark dependencies
        run: |
          for attempt in 1 2 3; do
            if uv run --extra notebooks python - <<'PYCODE'
          from delta import configure_spark_with_delta_pip
          from pyspark.sql import SparkSession

          spark = configure_spark_with_delta_pip(
              SparkSession.builder.master("local[1]").appName("ci-delta-dependencies")
          ).getOrCreate()
          spark.stop()
          PYCODE
            then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
          done
          exit 1

      - name: Validate
        run: make validate
