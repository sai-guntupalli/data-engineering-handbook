# Mirrors `make validate`: lint + tests, notebook audit, execute every notebook
# (as Colab's "Run all" would), then build the site. Keep the two in sync.

name: Checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # PySpark notebooks need a JVM; Spark 3.5 supports Java 8-21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Audit notebooks
        run: make check

      - name: Run every notebook
        run: make notebooks JOBS=4

      - name: Build site
        run: make build
