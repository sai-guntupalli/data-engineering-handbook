# Deploys the static gallery to GitHub Pages on every push to master.
#
# One-time prerequisite (repository settings): Pages -> Build and deployment ->
# Source: "GitHub Actions". The site then lives at
#   https://sai-guntupalli.github.io/data-engineering-handbook/
#
# The Pages build sets NEXT_PUBLIC_BASE_PATH (see next.config.ts) because
# project pages serve under /<repo>. Local dev and the repo-checks workflow
# keep building at the bare origin. The app lives in site/.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Cheap structural gate before shipping; notebook execution runs in the
      # Checks workflow.
      - name: Audit notebooks
        run: make check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install app dependencies
        run: npm --prefix site ci

      - name: Build the gallery app
        run: npm --prefix site run build
        env:
          # GitHub Pages project pages serve under /data-engineering-handbook.
          NEXT_PUBLIC_BASE_PATH: /data-engineering-handbook

      # Static design mockups, served at /data-engineering-handbook/mockups/.
      - name: Add design mockups
        run: make mockups-bundle

      # Without this, GitHub Pages' implicit Jekyll build drops the `_next/`
      # asset directory (it treats underscore-prefixed paths as Jekyll internals).
      - name: Disable Jekyll processing
        run: touch site/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4