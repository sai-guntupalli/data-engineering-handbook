# Chat provider configuration for the interactive notebook viewer backend.
# Copy this file to chat.config.yml (gitignored) and adjust. A missing
# chat.config.yml falls back to the provider/model below.
provider: openrouter
model: anthropic/claude-sonnet-4.5
# max_tokens: 1024
# temperature: 0.7

# API keys never go in this file; they come from the environment:
#   openrouter -> OPENROUTER_API_KEY
#   ollama     -> OLLAMA_API_KEY
# CHAT_PROVIDER and CHAT_MODEL (environment) override provider/model here.
