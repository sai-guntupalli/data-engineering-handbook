[project]
name = "data-engineering-handbook"
version = "0.1.0"
description = "The data engineering handbook: runnable Jupyter notebooks for every topic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Everything the notebooks import, plus the tooling that executes them.
# Keep in step with each notebook's setup-cell PACKAGES (Colab installs from those).
# PySpark notebooks also need Java 8-21 on PATH or JAVA_HOME.
notebooks = [
    # tooling
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "packaging>=24",
    # `!pip install` lines in notebooks (Colab-style package installs) need pip inside the venv
    "pip>=24",
    # notebook packages
    "boto3>=1.34",
    "deltalake>=1.0",
    "duckdb>=1.4",
    "fakeredis[lua]>=2.20",
    "fastavro>=1.9",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mongomock>=4.1",
    "moto[s3,dynamodb]>=5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "pyiceberg[sql-sqlite,pyarrow,pyiceberg-core]>=0.9",
    "pyspark>=3.5,<4",
    "pytest>=8",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "setuptools>=70",  # provides distutils, which PySpark 3.5 imports on Python 3.12+
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
]

[tool.uv]
# This repository ships notebooks and a web app, not an importable Python package.
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
