[project]
name = "data-engineering-handbook"
version = "0.1.0"
description = "The data engineering handbook: runnable Jupyter notebooks for every topic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Notebook tooling: run `uv sync --extra notebooks`, then `make notebooks`.
notebooks = [
    "duckdb>=1.0",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
# Spark notebooks additionally need PySpark and a Java runtime (Java 17+ recommended).
notebooks-spark = [
    "pyspark>=3.5,<4",
    "pandas>=2.2",
]

[tool.uv]
# This repository ships notebooks and a web app, not an importable Python package.
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
