[project]
name = "data-engineering-handbook"
version = "0.1.0"
description = "The data engineering handbook: runnable Jupyter notebooks for every topic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Notebook tooling: run `uv sync --extra notebooks`, then `make notebooks`.
notebooks = [
    "duckdb>=1.0",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]
# Spark notebooks additionally need PySpark and a Java runtime (Java 17+ recommended).
notebooks-spark = [
    "pyspark>=3.5",
    "pandas>=2.2",
]
# Local interactive viewer backend: run `uv sync --extra interactive` (or `make chat-install`).
interactive = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# This repository ships notebooks and a web app, not an importable Python package.
package = false
